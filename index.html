  <script>
    'use strict';
    const payload=JSON.parse(document.getElementById('encrypted-data').textContent);
    const gate=document.getElementById('gate'),viewer=document.getElementById('viewer'),frame=document.getElementById('dashboard'),password=document.getElementById('password'),submit=document.getElementById('submit'),error=document.getElementById('error');
    const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
    document.getElementById('unlock').addEventListener('submit',async event=>{
      event.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='확인 중…';
      try{
        if(!window.isSecureContext||!crypto.subtle)throw new Error('secure-context');
        if(payload.version!==1)throw new Error('version');
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
        password.value='';
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
        const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv),additionalData:new TextEncoder().encode('rd-notice-dashboard:v1'),tagLength:128},key,bytes(payload.ciphertext));
        frame.srcdoc=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);gate.hidden=true;viewer.hidden=false;document.getElementById('lock').focus();
      }catch(reason){password.value='';error.textContent=reason.message==='secure-context'?'HTTPS 주소에서 다시 열어 주세요.':'비밀번호가 맞지 않거나 화면을 열 수 없습니다.';password.focus();}
      finally{submit.disabled=false;submit.textContent='대시보드 보기';}
    });
    document.getElementById('lock').addEventListener('click',()=>{frame.srcdoc='';viewer.hidden=true;gate.hidden=false;error.textContent='';password.value='';password.focus();});
  </script>
